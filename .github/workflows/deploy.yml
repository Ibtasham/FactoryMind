name: Deploy FactoryMind to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve Vite deployment base path
        id: resolve_base
        run: |
          RAW_BASE="${{ steps.pages.outputs.base_path }}"
          if [ -z "$RAW_BASE" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            case "$RAW_BASE" in
              */) echo "base_path=${RAW_BASE}" >> "$GITHUB_OUTPUT" ;;
              *) echo "base_path=${RAW_BASE}/" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint, type-check & run tests
        run: |
          bun run lint
          bun run test

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.resolve_base.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.origin }}
          VITE_STATIC_ONLY: 'true'
        run: bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
